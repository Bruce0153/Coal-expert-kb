name: Apply Milestone C

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Milestone C migration
        run: |
          python .migration/milestone_c_core.py
          python .migration/milestone_c_integration.py
          python .migration/milestone_c_tests.py
          python .migration/milestone_c_fixes.py
      - name: Remove migration files
        run: rm -rf .migration
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Normalize Python imports
        run: |
          ruff check src/coal_kb scripts tests --select E,F,I,B --ignore E501,B905 --fix || true
      - name: Validate complex evaluation sample
        id: validate
        continue-on-error: true
        run: PYTHONPATH=src python scripts/validate_complex_dataset.py --require-all-types > milestone_c_validation.txt 2>&1
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-c-validation
          path: milestone_c_validation.txt
      - name: Stop on validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1
      - name: Run offline repository checks
        run: bash scripts/quality/check_repository.sh
      - name: Commit Milestone C
        run: |
          git config user.name "repository-maintenance-bot"
          git config user.email "repository-maintenance-bot@users.noreply.github.com"
          rm -f milestone_c_validation.txt
          git add -A
          git reset .github/workflows
          git commit -m "feat: complete Milestone C complex science QA"
          git push
