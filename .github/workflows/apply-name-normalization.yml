name: Apply Name Normalization

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repository normalization
        run: python .normalize/apply_name_normalization.py
      - name: Stabilize offline quality gate
        run: python .normalize/stabilize_quality_gate.py
      - name: Remove temporary migration files
        run: |
          rm -rf .normalize
          rm .github/workflows/apply-name-normalization.yml
      - name: Install offline quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile Python sources
        run: |
          source "$SCRIPT_DIR/config.sh"
          python -m compileall -q "${SOURCE_PATHS[@]}"
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name "*.pyc" -delete
      - name: Lint and normalize Python sources
        run: |
          source "$SCRIPT_DIR/config.sh"
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905 --fix || true
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905
      - name: Type-check canonical packages
        run: |
          source "$SCRIPT_DIR/config.sh"
          MYPYPATH="$REPO_ROOT/src" mypy --follow-imports=skip --ignore-missing-imports "${MYPY_TARGETS[@]}"
      - name: Test naming and architecture
        id: architecture
        continue-on-error: true
        run: |
          source "$SCRIPT_DIR/config.sh"
          mkdir -p .pytest_tmp/architecture
          pytest -q --basetemp=.pytest_tmp/architecture -o cache_dir=.pytest_cache/architecture "${ARCHITECTURE_TESTS[@]}" > architecture-report.txt 2>&1
      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: architecture-report.txt
      - name: Stop on architecture failure
        if: steps.architecture.outcome == 'failure'
        run: exit 1
      - name: Test foundation modules
        run: |
          source "$SCRIPT_DIR/config.sh"
          mkdir -p .pytest_tmp/foundation
          pytest -q --basetemp=.pytest_tmp/foundation -o cache_dir=.pytest_cache/foundation "${FOUNDATION_TESTS[@]}"
      - name: Test context smoke path
        run: |
          source "$SCRIPT_DIR/config.sh"
          mkdir -p .pytest_tmp/context
          pytest -q --basetemp=.pytest_tmp/context -o cache_dir=.pytest_cache/context "${RAG_TESTS[@]}"
          rm -rf .pytest_tmp
      - name: Commit normalized repository
        run: |
          git config user.name "repository-maintenance-bot"
          git config user.email "repository-maintenance-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize repository file names and checks"
          git push
