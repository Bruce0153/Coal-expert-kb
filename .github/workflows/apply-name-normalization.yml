name: Apply Name Normalization

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repository normalization
        run: python .normalize/apply_name_normalization.py
      - name: Stabilize offline quality gate
        run: |
          python - <<'PY'
          from pathlib import import Path
          PY
