name: Apply Name Normalization

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repository normalization
        run: python .normalize/apply_name_normalization.py
      - name: Install offline quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
          python -m pip install -e . --no-deps
      - name: Validate normalized repository
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash scripts/quality/check_repository.sh
      - name: Commit normalized repository
        run: |
          rm -rf .normalize
          rm .github/workflows/apply-name-normalization.yml
          git config user.name "repository-maintenance-bot"
          git config user.email "repository-maintenance-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize repository file names and checks"
          git push
