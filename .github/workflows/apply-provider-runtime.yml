name: Apply Provider Runtime

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply provider runtime migration
        run: python .migration/apply_provider_runtime.py
      - name: Remove migration files
        run: |
          rm -rf .migration
          rm .github/workflows/apply-provider-runtime.yml
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Normalize Python imports
        run: |
          ruff check src/coal_kb scripts tests --select E,F,I,B --ignore E501,B905 --fix || true
      - name: Run offline repository checks
        run: bash scripts/quality/check_repository.sh
      - name: Commit provider runtime
        run: |
          git config user.name "repository-maintenance-bot"
          git config user.email "repository-maintenance-bot@users.noreply.github.com"
          git add -A
          git reset .github/workflows
          git commit -m "refactor: modularize local and remote providers"
          git push
