name: Diagnose Milestone C

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply migration
        run: |
          python .migration/milestone_c_core.py
          python .migration/milestone_c_integration.py
          python .migration/milestone_c_tests.py
          python .migration/milestone_c_fixes.py
          rm -rf .migration
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          source "$SCRIPT_DIR/config.sh"
          python -m compileall "${SOURCE_PATHS[@]}" > milestone_c_compile.txt 2>&1
      - name: Upload compile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-c-compile
          path: milestone_c_compile.txt
      - name: Stop on compile failure
        if: steps.compile.outcome == 'failure'
        run: exit 1
      - name: Ruff
        run: |
          source "$SCRIPT_DIR/config.sh"
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905 --fix || true
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: |
          source "$SCRIPT_DIR/config.sh"
          MYPYPATH="$REPO_ROOT/src" mypy --follow-imports=skip --ignore-missing-imports "${MYPY_TARGETS[@]}" > milestone_c_mypy.txt 2>&1
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-c-mypy
          path: milestone_c_mypy.txt
      - name: Stop on mypy failure
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Architecture tests
        id: architecture
        continue-on-error: true
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${ARCHITECTURE_TESTS[@]}" > milestone_c_architecture.txt 2>&1
      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-c-architecture
          path: milestone_c_architecture.txt
      - name: Stop on architecture failure
        if: steps.architecture.outcome == 'failure'
        run: exit 1
      - name: Foundation tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${FOUNDATION_TESTS[@]}"
      - name: Context tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${RAG_TESTS[@]}"
