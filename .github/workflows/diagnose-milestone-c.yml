name: Diagnose Milestone C

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply migration
        run: |
          python .migration/milestone_c_core.py
          python .migration/milestone_c_integration.py
          python .migration/milestone_c_tests.py
          python .migration/milestone_c_fixes.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile
        run: |
          source "$SCRIPT_DIR/config.sh"
          python -m compileall -q "${SOURCE_PATHS[@]}"
      - name: Ruff
        run: |
          source "$SCRIPT_DIR/config.sh"
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905 --fix || true
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905
      - name: Mypy
        run: |
          source "$SCRIPT_DIR/config.sh"
          MYPYPATH="$REPO_ROOT/src" mypy --follow-imports=skip --ignore-missing-imports "${MYPY_TARGETS[@]}"
      - name: Architecture tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${ARCHITECTURE_TESTS[@]}"
      - name: Foundation tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${FOUNDATION_TESTS[@]}"
      - name: Context tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${RAG_TESTS[@]}"
