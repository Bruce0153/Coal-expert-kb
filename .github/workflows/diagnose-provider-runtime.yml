name: Diagnose Provider Runtime

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply migration
        run: python .migration/apply_provider_runtime.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile
        run: |
          source "$SCRIPT_DIR/config.sh"
          python -m compileall -q "${SOURCE_PATHS[@]}"
      - name: Ruff
        run: |
          source "$SCRIPT_DIR/config.sh"
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905 --fix || true
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: |
          source "$SCRIPT_DIR/config.sh"
          MYPYPATH="$REPO_ROOT/src" mypy --follow-imports=skip --ignore-missing-imports "${MYPY_TARGETS[@]}" > mypy-report.txt 2>&1
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-mypy-report
          path: mypy-report.txt
      - name: Stop on mypy failure
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Architecture tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${ARCHITECTURE_TESTS[@]}"
      - name: Foundation tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${FOUNDATION_TESTS[@]}"
      - name: Context tests
        run: |
          source "$SCRIPT_DIR/config.sh"
          pytest -q "${RAG_TESTS[@]}"
