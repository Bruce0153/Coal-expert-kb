name: Retry Docs and Config Consistency

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SCRIPT_DIR: ${{ github.workspace }}/scripts/quality
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply migration and syntax fix
        run: |
          python .migration/apply_docs_config.py
          python .migration/fix_docs_config_test.py
      - name: Remove migration files
        run: rm -rf .migration
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt
      - name: Compile Python sources
        run: |
          source "$SCRIPT_DIR/config.sh"
          python -m compileall -q "${SOURCE_PATHS[@]}"
          find src scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src scripts tests -type f -name "*.pyc" -delete
      - name: Lint Python sources
        run: |
          source "$SCRIPT_DIR/config.sh"
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905 --fix || true
          ruff check "${SOURCE_PATHS[@]}" --select E,F,I,B --ignore E501,B905
      - name: Type-check canonical packages
        run: |
          source "$SCRIPT_DIR/config.sh"
          MYPYPATH="$REPO_ROOT/src" mypy --follow-imports=skip --ignore-missing-imports "${MYPY_TARGETS[@]}"
      - name: Test offline gate
        run: bash scripts/quality/check_repository.sh
      - name: Commit changes
        run: |
          git config user.name "repository-maintenance-bot"
          git config user.email "repository-maintenance-bot@users.noreply.github.com"
          git add -A
          git reset .github/workflows
          git commit -m "docs: align architecture and embedding configuration"
          git push
