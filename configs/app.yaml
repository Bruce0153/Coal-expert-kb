paths:
  raw_pdfs_dir: "data/raw_pdfs"
  raw_docs_dir: "data/raw_docs"
  interim_dir: "data/interim"
  artifacts_dir: "data/artifacts"
  chroma_dir: "storage/chroma_db"
  sqlite_path: "storage/expert.db"
  manifest_path: "storage/manifest.json"

model_versions:
  embedding_version: "v1"

chunking:
  strategy: markdown_hierarchical_semantic
  max_parent_tokens: 600
  max_child_tokens: 200
  overlap_tokens: 20
  similarity_threshold: 0.72
  heading_max_depth: 4
  embedding_backend: configured
  chunk_size: 900
  chunk_overlap: 120
  profile_by_section:
    results: {chunk_size: 900, chunk_overlap: 150}
    discussion: {chunk_size: 900, chunk_overlap: 150}
    methods: {chunk_size: 650, chunk_overlap: 120}
    conditions: {chunk_size: 650, chunk_overlap: 120}
    unknown: {chunk_size: 750, chunk_overlap: 120}

pdf_markdown:
  enabled: true
  heading_max_depth: 4
  two_column_mode: auto
  drop_headers_footers: true
  min_heading_font_ratio: 1.15

chroma:
  collection_name: "coal_gasification_papers"

logging:
  level: "INFO"

elastic:
  host: "http://localhost:9200"
  index_prefix: "coal_kb_chunks"
  alias_current: "coal_kb_chunks_current"
  alias_prev: "coal_kb_chunks_prev"
  verify_certs: false
  timeout_s: 180
  bulk_chunk_size: 100
  enable_icu_analyzer: true

ingestion:
  include_exts: ["pdf", "txt", "md", "docx"]
  drop_reference_like_unknown: true
  drop_sections: [references, acknowledgements, contents, appendix]

query_rewrite:
  enable_llm: false

tenancy:
  enabled: false
  default_tenant_id: "default"
  enforce_tenant_filter: true

registry:
  sqlite_path: "storage/kb.db"

backend: "elastic"

retrieval:
  k: 10
  rrf_k: 60
  max_per_source: 4
  max_relax_steps: 3
  range_expand_schedule: [0.05, 0.1, 0.2]
  mode: "broad"
  rerank_enabled: true
  rerank_top_n: 10
  two_stage:
    enabled: true
    parent_k_candidates: 200
    parent_k_final: 80
    max_parents: 80
    child_k_candidates: 200
    child_k_final: 60
    allow_relax_in_stage2: true

complex_qa:
  enabled: true
  max_subqueries: 4
  max_multi_hop_steps: 3
  comparison_k_per_side: 4
  cross_document_min_sources: 2
  cross_document_max_per_source: 2
  aggregation_record_limit: 500
  aggregation_evidence_limit: 12
  table_records_path: "data/interim/table_records.jsonl"
  table_top_k: 5
  base_context_tokens: 2400
  base_evidence_chunks: 10

tokenizer:
  mode: local
  remote:
    provider: openai_compatible
    base_url: "https://api.example.com/v1"
    api_key_env: "TOKENIZER_API_KEY"
    model: "remote-tokenizer"
    endpoint: "/tokenize"
  local:
    provider: huggingface
    model: "Qwen/Qwen3-8B"
    model_path: null
    device: auto
    trust_remote_code: true

embeddings:
  mode: remote
  remote:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "text-embedding-v4"
    dimensions: 1024
  local:
    provider: huggingface
    model: "BAAI/bge-m3"
    model_path: null
    device: auto
    dimensions: 1024

rerank:
  mode: remote
  remote:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/rerank"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "qwen3-rerank"
    endpoint: "/text-rerank/text-rerank"
    timeout: 60
  local:
    provider: cross_encoder
    model: "BAAI/bge-reranker-base"
    model_path: null
    device: auto

llm:
  mode: remote
  temperature: 0.0
  remote:
    provider: dashscope
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "qwen3.5-flash"
    timeout: 60
  local:
    provider: vllm
    base_url: "http://127.0.0.1:8001/v1"
    model: "Qwen/Qwen3-8B"
    model_path: null
    device: auto
    timeout: 60
