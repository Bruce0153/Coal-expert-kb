[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-expert-kb"
version = "0.1.0"
description = "Evidence-grounded knowledge base for coal pyrolysis and gasification literature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hualong Zeng" }]

dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7",
  "tqdm>=4.66",
  "SQLAlchemy>=2.0",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-chroma>=0.1.2",
  "langchain-openai>=0.2",
  "langchain-huggingface>=0.1",
  "langchain-text-splitters>=0.3",
  "chromadb>=0.5",
  "pypdf>=4.0",
  "pymupdf>=1.24",
  "tiktoken>=0.7",
  "sentence-transformers>=2.6",
  "torch>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "elasticsearch>=8.12",
  "uvicorn>=0.30",
  "requests>=2.31",
]

[project.optional-dependencies]
docs = [
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "python-pptx>=0.6",
  "openpyxl>=3.1",
]
ocr = [
  "pytesseract>=0.3",
  "pillow>=10.0",
]
training = [
  "accelerate>=0.28",
  "bitsandbytes>=0.43",
  "datasets>=2.18",
  "peft>=0.10",
  "transformers>=4.40",
  "trl>=0.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".git",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
